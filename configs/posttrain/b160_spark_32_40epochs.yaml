model:
  model: OST_B
  img_size: 256
  patch_size: 16
  label_drop_prob: 0.0
  class_tokens: 8
  guidance_tokens: 0
  interval_tokens: 0
  norm_eps: 0.01
  norm_p: 1.0
  rope_2d: true
  learned_pe: true
  in_channels: 3
  P_mean: 0.8
  P_std: 0.8
  perceptual_threshold: 0.8
train:
  steps: 100120
  global_batch_size: 512
  seed: 1
  dtype: bf16
  compile: true
  save_every: 12515
  print_freq: 10
optimizer:
  optimizer: adamw
  lr: 1.0e-05
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.0
  grad_clip: 1.0
  warmup_steps: 125
matching:
  stack: convnext_spark_pretrained
  kind: featurewise_ot
  coefficient: 5.0
  global_classes_per_step: 16
  samples_per_class: 32
  real_references_per_class: 32
  epsilon: 0.001
  epsilon_mixture:
    '0.001': 0.75
    '0.01': 0.25
  num_iterations: 1000
  tolerance: 1.0e-06
  energy_delta: 0.04549544751644135
  microbatch: 8
  seed: 7919
  mae_bf16_channels_last: false
  compile_encoders: true
  sinkhorn_cuda_graph: true
data:
  data_path: data/imagenet
  num_classes: 1000
  reference_workers: 4
  encoder_cache: assets/ot/spark
sampling:
  cfg: 1.0
  t_min: 0.1
  t_max: 1.0
  num_steps: 1
evaluation:
  every: 12515
  num_images: 50000
  batch_size: 32
  stats_dir: assets/fid_stats
  prc_reference: assets/drive_eval/real_inception_10000.pt
  prc_k: 3
  prc_batch_size: 1000
  protocol: drive_fid_is_pr
  real_num_images: 10000
  prc_images: assets/drive_eval/imagenet_val_prc_arr0.npz
  fid_reference: assets/drive_eval/imagenet_256_fid_stats.npz
initialization:
  checkpoint: checkpoints/pretraining/priming_b_160.pth
experiment:
  profile: b160_spark_32_40epochs
  dataset_size: 1281167
  epochs: 40
  steps_per_epoch: 2503
  epoch_definition: ceil(1281167 / global_batch_size); classwise random reference
    sampling
